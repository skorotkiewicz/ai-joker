[llm]
# Include /v1 if your server uses it. The model must support tool calling.
base_url = "http://127.0.0.1:1234/v1"
model = "local-model"
# Bun loads .env automatically. Local servers can leave the key unset.
api_key_env = "OPENAI_API_KEY"
# api_key = "your-key"  # Prefer the environment variable for secrets.

[music]
# ~/ expands to your home. Relative paths are relative to this config file.
library = "~/Music"

[player]
binary = "mpv"
